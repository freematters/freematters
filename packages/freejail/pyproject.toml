[project]
name = "freejail"
version = "0.1.0"
description = "Daemonless container sandboxing CLI with egress policy enforcement"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "rich>=13.0",
    "cryptography>=42.0",
    "pyyaml>=6.0",
]

[project.scripts]
fj = "freejail.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

# ---------- ruff ----------

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["freejail"]

# ---------- pytest ----------

[tool.pytest.ini_options]
testpaths = ["tests"]
